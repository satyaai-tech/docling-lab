[project]
name = "docling-wrapper"
version = "0.1.0"
description = "FastAPI wrapper service for calling docling-serve endpoints"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.12",
  "uvicorn>=0.32.0",
]

[tool.uv]
dev-dependencies = [
  "pytest>=8.3.0",
]
